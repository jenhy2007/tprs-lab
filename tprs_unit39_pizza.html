  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Unit 39 • Gli Ingredienti della Pizza (TPRS)</title>
  <style>
    :root {
      --bg: #fdfaf5;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #d97706;
      --primary-bg: #fef3c7;
      --accent: #1e40af;
      --accent-bg: #dbeafe;
      --green: #047857;
      --green-bg: #d1fae5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px 60px;
      line-height: 1.65;
    }
    .container { max-width: 860px; margin: 0 auto; }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .back-btn {
      text-decoration: none;
      color: var(--accent);
      font-weight: 700;
      font-size: 0.92rem;
      background: var(--accent-bg);
      padding: 6px 14px;
      border-radius: 999px;
    }
    .voice-status {
      font-size: 0.82rem;
      color: var(--muted);
      background: #f3f4f6;
      padding: 5px 12px;
      border-radius: 999px;
    }
    header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.03);
    }
    .badge {
      display: inline-block;
      background: var(--primary-bg);
      color: var(--primary);
      font-weight: 800;
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    header h1 { font-size: 1.6rem; color: #111827; margin-bottom: 6px; }
    header p { color: var(--muted); font-size: 0.95rem; }

    .controls-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 22px;
      background: var(--card);
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      align-items: center;
    }
    .tier-btn, .action-btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f9fafb;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.86rem;
      color: var(--text);
      transition: all 0.15s;
    }
    .tier-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .play-all-btn {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
      margin-left: auto;
    }
    .speed-select {
      padding: 7px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .line-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 12px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      transition: border-color 0.2s, background 0.2s;
    }
    .line-card.speaking {
      border-color: var(--primary);
      background: #fffbeb;
    }
    .speak-btn {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--accent-bg);
      color: var(--accent);
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s, background 0.15s;
    }
    .speak-btn:hover {
      background: var(--accent);
      color: #fff;
      transform: scale(1.06);
    }
    .line-body { flex: 1; }
    .speaker-tag {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--primary);
      margin-bottom: 3px;
    }
    .it-text {
      font-size: 1.08rem;
      font-weight: 600;
      color: #111827;
    }
    .it-text.blind {
      filter: blur(6px);
      user-select: none;
      cursor: pointer;
    }
    .it-text.blind:hover {
      filter: blur(2px);
    }
    .zh-text {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .zh-text.hidden { display: none; }

    .xray-chip {
      display: inline-block;
      margin-top: 8px;
      margin-right: 6px;
      padding: 4px 10px;
      border-radius: 8px;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .xray-chip:hover { background: #fde68a; }

    .xray-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .xray-modal.open { display: flex; }
    .xray-box {
      background: #fff;
      border-radius: 18px;
      max-width: 480px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }
    .xray-box h3 { font-size: 1.2rem; color: #111827; margin-bottom: 8px; }
    .xray-box p { font-size: 0.94rem; color: #374151; margin-bottom: 12px; }
    .xray-close {
      background: #111827;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <a href="index.html" class="back-btn">← 返回书架</a>
      <span class="voice-status" id="voiceStatus">🔊 正在加载意大利语语音...</span>
    </div>

    <header>
      <span class="badge">🇮🇹 Italiano • Unit 39 TPRS</span>
      <h1>🍕 Gli Ingredienti della Pizza</h1>
      <p>Junior 与披萨大师 Adriano 的脑洞对话 • 点击任意 🔊 喇叭单独精听，或切换三阶盲听模式</p>
    </header>

    <div class="controls-bar">
      <button class="tier-btn active" onclick="setTier(1, this)">一阶：全双语对照</button>
      <button class="tier-btn" onclick="setTier(2, this)">二阶：纯意语去中文</button>
      <button class="tier-btn" onclick="setTier(3, this)">三阶：纯盲听遮罩</button>
      <select id="rateSelect" class="speed-select" title="语速调节">
        <option value="0.75">0.75x 慢速精听</option>
        <option value="0.92" selected="">0.92x 自然清晰</option>
        <option value="1.05">1.05x 原速挑战</option>
      </select>
      <button class="action-btn play-all-btn" id="playAllBtn" onclick="togglePlayAll()">▶ 连续朗读全文</button>
    </div>

    <div id="storyContainer"></div>
  </div>

  <div class="xray-modal" id="xrayModal" onclick="closeXray(event)">
    <div class="xray-box" onclick="event.stopPropagation()">
      <h3 id="xrayTitle"></h3>
      <p id="xrayBody"></p>
      <button class="xray-close" onclick="document.getElementById(&#39;xrayModal&#39;).classList.remove(&#39;open&#39;)">明白了 ✓</button>
    </div>
  </div>

  <script>
    const storyLines = [
      {
        speaker: "Narratore",
        it: "Junior è in pizzeria con Adriano, il famoso pizzaiolo.",
        zh: "Junior 和著名的披萨师傅 Adriano 一起在披萨店里。",
        xrays: [
          { label: "🔍 pizzaiolo (O队)", title: "pizzaiolo — 披萨师傅", desc: "词尾 -o 属于 O队（阳性单数），对应定冠词 il（il pizzaiolo）。如果是女披萨师傅则是 la pizzaiola。" }
        ]
      },
      {
        speaker: "Junior",
        it: "Adriano, oggi voglio preparare una pizza speciale per mio papà!",
        zh: "Adriano，今天我想为我爸爸准备一份特别的披萨！",
        xrays: [
          { label: "🤖 voglio (volere)", title: "变形金刚动词：volere（想要）", desc: "原形 volere → 我想要：voglio；你想要：vuoi；他/她想要：vuole。后面直接接动词原形 preparare。" }
        ]
      },
      {
        speaker: "Adriano",
        it: "Che bella idea! Che ingredienti vuoi mettere sulla pizza?",
        zh: "真是个好主意！你想在披萨上放什么配料？",
        xrays: [
          { label: "🔍 gli ingredienti (O队复数)", title: "ingrediente → ingredienti", desc: "单数 il/un ingrediente（O队），变成复数时词尾 -e 变 -i，冠词变成 gli（gli ingredienti）。" }
        ]
      },
      {
        speaker: "Junior",
        it: "Allora, prima metto il pomodoro e la mozzarella. Poi voglio aggiungere i marshmallow!",
        zh: "那么，我先放番茄和马苏里拉奶酪。然后我想加棉花糖！",
        xrays: [
          { label: "🤖 metto (mettere)", title: "变形金刚动词：mettere（放）", desc: "原形 mettere → 我放：metto；你放：metti；他放：mette。" }
        ]
      },
      {
        speaker: "Adriano",
        it: "Cosa?! I marshmallow sulla pizza? Sei sicuro, Junior?",
        zh: "什么？！披萨上放棉花糖？你确定吗，Junior？",
        xrays: [
          { label: "🤖 sei (essere)", title: "核心变形金刚：essere（是）", desc: "我是：sono；你是：sei；他是：è。这里 Sei sicuro? 意为“你确定吗？”。" }
        ]
      },
      {
        speaker: "Junior",
        it: "Sì! I marshmallow sono dolci e morbidi. Quando li cuciniamo, diventano fantastici!",
        zh: "是的！棉花糖又甜又软。当我们烤它们的时候，它们会变得超级棒！",
        xrays: [
          { label: "🎯 代词 li (指代 O队复数)", title: "直接宾语代词：li（它们 — O队复数）", desc: "这里的 li 指代前面的 i marshmallow（阳性复数）。li cuciniamo = 我们烤它们。" }
        ]
      },
      {
        speaker: "Adriano",
        it: "Mamma mia... E dopo i marshmallow, cosa ci metti?",
        zh: "我的天哪……在棉花糖之后，你还要往上面放什么？",
        xrays: [
          { label: "🔍 ci metti", title: "小词 ci（在那里/在上面）", desc: "ci 在这里指代 sulla pizza（在披萨上），合起来 cosa ci metti = 你往披萨上放什么。" }
        ]
      },
      {
        speaker: "Junior",
        it: "Prendo delle fragole fresche e le metto sopra il formaggio!",
        zh: "我拿一些新鲜草莓，然后把它们放在奶酪上面！",
        xrays: [
          { label: "🎯 代词 le (指代 A队复数)", title: "直接宾语代词：le（它们 — A队复数）", desc: "fragola（草莓）是 A队（阴性），复数 le fragole。所以后面用 le metto（我把它们放上去），注意与上面的 li 对比！" }
        ]
      },
      {
        speaker: "Adriano",
        it: "Fragole e marshmallow?! Questa non sarà una pizza, sarà un disastro!",
        zh: "草莓和棉花糖？！这不会是一张披萨，这将是一场灾难！",
        xrays: [
          { label: "⏳ sarà (essere 将来时)", title: "将来时变形：sarà（将会是）", desc: "essere 的一般将来时第三人称单数：sarà（它将是）。non sarà una pizza = 这不会是一张披萨。" }
        ]
      },
      {
        speaker: "Junior",
        it: "Aspetta! Manca ancora un ingrediente segreto: un po' di basilico fresco!",
        zh: "等等！还差最后一样秘密配料：一点点新鲜罗勒叶！",
        xrays: [
          { label: "🔍 manca (mancare)", title: "高频动词：mancare（缺少/还差）", desc: "Manca un ingrediente = 还缺少一样配料；如果缺很多样则用复数 Mancano..." }
        ]
      },
      {
        speaker: "Adriano",
        it: "Va bene, proviamo! La metterò nel forno per dieci minuti, ma poi la mangerai tu!",
        zh: "好吧，我们试试！我会把它放进烤箱烤十分钟，不过待会儿由你自己吃掉它！",
        xrays: [
          { label: "🎯 la + ⏳ metterò / mangerai", title: "代词 la + 将来时词尾 (-ò / -ai)", desc: "la 指代 la pizza（A队单数）。metterò（我将放，-ò 表示“我将”）；mangerai（你将吃，-ai 表示“你将”）。" }
        ]
      }
    ];

    let currentTier = 1;
    let isPlayingAll = false;
    let playAllIndex = 0;
    let italianVoice = null;

    function loadItalianVoice() {
      if (!('speechSynthesis' in window)) {
        document.getElementById('voiceStatus').textContent = '⚠️ 当前浏览器不支持语音朗读';
        return;
      }
      const voices = window.speechSynthesis.getVoices();
      italianVoice =
        voices.find(v => v.lang === 'it-IT' && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Elsa') || v.name.includes('Alice'))) ||
        voices.find(v => v.lang.toLowerCase().startsWith('it'));

      const statusEl = document.getElementById('voiceStatus');
      if (italianVoice) {
        statusEl.textContent = '🔊 语音就绪 (' + italianVoice.name + ')';
      } else if (voices.length > 0) {
        statusEl.textContent = '🔊 使用默认 it-IT 语音引擎';
      }
    }

    if ('speechSynthesis' in window) {
      loadItalianVoice();
      window.speechSynthesis.onvoiceschanged = loadItalianVoice;
    }

    function renderStory() {
      const container = document.getElementById('storyContainer');
      container.innerHTML = '';

      storyLines.forEach((line, idx) => {
        const card = document.createElement('div');
        card.className = 'line-card';
        card.id = 'line-' + idx;

        const btn = document.createElement('button');
        btn.className = 'speak-btn';
        btn.type = 'button';
        btn.title = '点击朗读这一句';
        btn.textContent = '🔊';
        btn.addEventListener('click', () => {
          stopPlayAll();
          speakLine(idx);
        });

        const body = document.createElement('div');
        body.className = 'line-body';

        const speaker = document.createElement('div');
        speaker.className = 'speaker-tag';
        speaker.textContent = line.speaker;

        const itDiv = document.createElement('div');
        itDiv.className = 'it-text' + (currentTier === 3 ? ' blind' : '');
        itDiv.textContent = line.it;
        if (currentTier === 3) {
          itDiv.title = '点击临时揭开文字';
          itDiv.addEventListener('click', () => itDiv.classList.toggle('blind'));
        }

        const zhDiv = document.createElement('div');
        zhDiv.className = 'zh-text' + (currentTier >= 2 ? ' hidden' : '');
        zhDiv.textContent = line.zh;

        body.appendChild(speaker);
        body.appendChild(itDiv);
        body.appendChild(zhDiv);

        if (line.xrays && line.xrays.length > 0) {
          line.xrays.forEach(x => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'xray-chip';
            chip.textContent = x.label;
            chip.addEventListener('click', () => openXray(x.title, x.desc));
            body.appendChild(chip);
          });
        }

        card.appendChild(btn);
        card.appendChild(body);
        container.appendChild(card);
      });
    }

    function speakLine(idx, onEndCallback) {
      if (!('speechSynthesis' in window)) {
        alert('您的浏览器不支持 Web Speech 语音朗读功能，建议使用 Chrome 或 Safari 打开。');
        return;
      }
      window.speechSynthesis.cancel();
      document.querySelectorAll('.line-card').forEach(c => c.classList.remove('speaking'));

      const card = document.getElementById('line-' + idx);
      if (card) card.classList.add('speaking');

      const utterance = new SpeechSynthesisUtterance(storyLines[idx].it);
      utterance.lang = 'it-IT';
      if (italianVoice) utterance.voice = italianVoice;
      utterance.rate = parseFloat(document.getElementById('rateSelect').value) || 0.92;

      utterance.onend = () => {
        if (card) card.classList.remove('speaking');
        if (onEndCallback) onEndCallback();
      };
      utterance.onerror = () => {
        if (card) card.classList.remove('speaking');
      };

      window.speechSynthesis.speak(utterance);
    }

    function togglePlayAll() {
      if (isPlayingAll) {
        stopPlayAll();
      } else {
        isPlayingAll = true;
        playAllIndex = 0;
        document.getElementById('playAllBtn').textContent = '⏹ 停止连读';
        playNextInQueue();
      }
    }

    function playNextInQueue() {
      if (!isPlayingAll || playAllIndex >= storyLines.length) {
        stopPlayAll();
        return;
      }
      const current = playAllIndex;
      playAllIndex++;
      speakLine(current, () => {
        if (isPlayingAll) {
          setTimeout(playNextInQueue, 450);
        }
      });
    }

    function stopPlayAll() {
      isPlayingAll = false;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      document.querySelectorAll('.line-card').forEach(c => c.classList.remove('speaking'));
      document.getElementById('playAllBtn').textContent = '▶ 连续朗读全文';
    }

    function setTier(tier, btn) {
      currentTier = tier;
      document.querySelectorAll('.tier-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderStory();
    }

    function openXray(title, desc) {
      document.getElementById('xrayTitle').textContent = title;
      document.getElementById('xrayBody').textContent = desc;
      document.getElementById('xrayModal').classList.add('open');
    }

    function closeXray(e) {
      if (e.target.id === 'xrayModal') {
        document.getElementById('xrayModal').classList.remove('open');
      }
    }

    renderStory();
  </script>
</body>
</html>
